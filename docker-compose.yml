# version: '3.8'

services:
  mysql:
    image: crpi-d81nvhgjqrzw3ppw.cn-hangzhou.personal.cr.aliyuncs.com/jw_docker_sql/tournament-mysql:fixed
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=curling_masters
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "12306:3306"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - mysql_data:/var/lib/mysql
      - ./curling_masters.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  app:
    image: crpi-d81nvhgjqrzw3ppw.cn-hangzhou.personal.cr.aliyuncs.com/jw_docker_sql/curling-masters:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
      # pull: false
      provenance: false
      sbom: false
    pull_policy: missing 
    ports:
      - "8080:8080"
    environment:
      # 数据库配置（使用环境变量覆盖默认配置）
      - MYSQL_DB_URL=${MYSQL_DB_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # 固定为 true，避免项目 .env 里误设 false 导致无法清除失败迁移（勿用 ${FLYWAY_REPAIR_ON_MIGRATE:-true}，会被宿主机 .env 插值成 false）
      - FLYWAY_REPAIR_ON_MIGRATE=true
      # 2c4g：堆 768m；生产请再加 SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseContainerSupport -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-}
    # 不覆盖 ENTRYPOINT，让 Dockerfile 使用 JAVA_OPTS
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    # 限制容器内存，避免 JVM/堆与 MySQL 争抢把 4G 宿主机打满
    mem_limit: 1280m
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
      # 必须用宿主机绝对路径（或下方 HOST_FRONTEND_DIR），不能只用 ./templates：
      # webhook 在容器内路径是 /compose，经 docker.sock 建容器时 ./ 会变成宿主机空目录 /compose/templates
      - ${HOST_FRONTEND_DIR:-.}/templates:/app/templates
      - ${HOST_FRONTEND_DIR:-.}/static:/app/static
  # redis:
  #   image: crpi-d81nvhgjqrzw3ppw.cn-hangzhou.aliyuncs.com/acs/redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - app-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

volumes:
  mysql_data:
  redis_data:

networks:
  app-network:
    driver: bridge
