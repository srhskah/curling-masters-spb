<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('忘记密码')}">
</head>

<body th:classappend="${ipBgClass}">
    <!-- 登录导航栏 -->
    <div th:replace="~{fragments :: navbar-login}"></div>

    <div class="container mt-4">
        <div class="login-container">
            <h2 class="text-center mb-4" data-i18n-key="page.forgotPassword.title">忘记密码</h2>

            <!-- 显示错误消息 -->
            <div th:replace="~{fragments :: error-alert}"></div>

            <!-- 显示成功消息 -->
            <div th:replace="~{fragments :: success-alert}"></div>

            <div class="alert alert-info">
                <p data-i18n-key="page.forgotPassword.description">点击提交后，系统将向超级管理员和普通管理员发送消息通知，管理员会为您重置密码。</p>
            </div>

            <form th:action="@{/user/forgot-password}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n-key="page.login.username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" data-i18n-key="page.forgotPassword.submitBtn">提交请求</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p><a href="/user/login" data-i18n-key="page.forgotPassword.backToLogin">返回登录</a></p>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <div th:replace="~{fragments :: footer}"></div>

    <!-- 脚本 -->
    <th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
