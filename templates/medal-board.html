<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('奖牌榜')}">
</head>

<body th:classappend="${ipBgClass}">
    <div th:replace="~{fragments :: navbar}"></div>
    <div th:replace="~{fragments :: success-alert}"></div>
    <div th:replace="~{fragments :: error-alert}"></div>

    <div class="container mt-4 mb-5">
            <div class="row mb-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                            <h5 class="mb-0" data-i18n-key="page.home.medal.total"><i class="bi bi-award"></i> 奖牌榜</h5>
                        </div>
                        <div class="card-body">
                            <div class="d-none d-lg-block">
                                <div class="row g-3">
                                    <div class="col-lg-6">
                                        <div class="border rounded p-2 h-100">
                                            <div class="fw-bold mb-2" data-i18n-key="page.home.medal.total">总奖牌榜</div>
                                            <ul class="nav nav-pills nav-sm mb-2" role="tablist">
                                                <li class="nav-item" role="presentation"
                                                    th:each="tab,st : ${homeTotalMedalBoard.tabs}">
                                                    <button class="nav-link"
                                                            th:classappend="${st.index == 0} ? ' active'"
                                                            data-bs-toggle="pill"
                                                            th:data-bs-target="|#homeTotalMedalLg_${tab.tabId}|"
                                                            type="button"
                                                            role="tab"
                                                            th:text="${tab.label}">等级</button>
                                                </li>
                                            </ul>
                                            <div class="tab-content">
                                                <div class="tab-pane fade"
                                                     th:each="tab,st : ${homeTotalMedalBoard.tabs}"
                                                     th:id="|homeTotalMedalLg_${tab.tabId}|"
                                                     th:classappend="${st.index == 0} ? ' show active'">
                                                    <div class="table-responsive">
                                                        <table class="table table-sm table-hover mb-0">
                                                            <thead class="table-light">
                                                            <tr><th style="width:56px;" data-i18n-key="common.rank">排名</th><th data-i18n-key="common.player">选手</th><th style="width:62px;">🥇</th><th style="width:62px;">🥈</th><th style="width:62px;">🥉</th></tr>
                                                            </thead>
                                                            <tbody>
                                                            <tr th:each="r,s : ${tab.rows}"
                                                                class="medal-board-row"
                                                                style="cursor:pointer;"
                                                                th:attr="data-board='total',data-level-code=${tab.code},data-user-id=${r.userId},data-username=${r.username}">
                                                                <td><span class="badge bg-primary" th:text="${s.index+1}">1</span></td>
                                                                <td><a th:href="@{/user/profile/{uid}(uid=${r.userId})}" class="text-decoration-none" onclick="event.stopPropagation();" th:text="${r.username}">选手</a></td>
                                                                <td th:text="${r.gold}">0</td>
                                                                <td th:text="${r.silver}">0</td>
                                                                <td th:text="${r.bronze}">0</td>
                                                            </tr>
                                                            <tr th:if="${#lists.isEmpty(tab.rows)}">
                                                                <td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td>
                                                            </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                                <div th:if="${#lists.isEmpty(homeTotalMedalBoard.tabs)}" class="text-muted small" data-i18n-key="page.home.noRankData">暂无总奖牌榜数据</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-lg-6">
                                        <div class="border rounded p-2 h-100">
                                            <div class="fw-bold mb-2" data-i18n-key="page.home.medal.season">当前赛季奖牌榜</div>
                                            <ul class="nav nav-pills nav-sm mb-2" role="tablist">
                                                <li class="nav-item" role="presentation"
                                                    th:each="tab,st : ${homeSeasonMedalBoard['tabs']}">
                                                    <button class="nav-link"
                                                            th:classappend="${st.index == 0} ? ' active'"
                                                            data-bs-toggle="pill"
                                                            th:data-bs-target="|#homeSeasonMedalLg_${tab.tabId}|"
                                                            type="button"
                                                            role="tab"
                                                            th:text="${tab.label}">等级</button>
                                                </li>
                                            </ul>
                                            <div class="tab-content">
                                                <div class="tab-pane fade"
                                                     th:each="tab,st : ${homeSeasonMedalBoard['tabs']}"
                                                     th:id="|homeSeasonMedalLg_${tab.tabId}|"
                                                     th:classappend="${st.index == 0} ? ' show active'">
                                                    <div class="table-responsive">
                                                        <table class="table table-sm table-hover mb-0">
                                                            <thead class="table-light">
                                                            <tr><th style="width:56px;" data-i18n-key="common.rank">排名</th><th data-i18n-key="common.player">选手</th><th style="width:62px;">🥇</th><th style="width:62px;">🥈</th><th style="width:62px;">🥉</th></tr>
                                                            </thead>
                                                            <tbody>
                                                            <tr th:each="r,s : ${tab.rows}"
                                                                class="medal-board-row"
                                                                style="cursor:pointer;"
                                                                th:attr="data-board='season',data-level-code=${tab.code},data-user-id=${r.userId},data-username=${r.username}">
                                                                <td><span class="badge bg-primary" th:text="${s.index+1}">1</span></td>
                                                                <td><a th:href="@{/user/profile/{uid}(uid=${r.userId})}" class="text-decoration-none" onclick="event.stopPropagation();" th:text="${r.username}">选手</a></td>
                                                                <td th:text="${r.gold}">0</td>
                                                                <td th:text="${r.silver}">0</td>
                                                                <td th:text="${r.bronze}">0</td>
                                                            </tr>
                                                            <tr th:if="${#lists.isEmpty(tab.rows)}">
                                                                <td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td>
                                                            </tr>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                                <div th:if="${#lists.isEmpty(homeSeasonMedalBoard['tabs'])}" class="text-muted small" data-i18n-key="page.home.noSeasonData">暂无赛季奖牌榜数据</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="d-lg-none">
                                <ul class="nav nav-pills mb-2" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#homeMedalMobileTotal" type="button" role="tab">总奖牌榜</button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#homeMedalMobileSeason" type="button" role="tab">当前赛季奖牌榜</button>
                                    </li>
                                </ul>
                                <div class="tab-content">
                                    <div class="tab-pane fade show active" id="homeMedalMobileTotal" role="tabpanel">
                                        <ul class="nav nav-pills nav-sm mb-2" role="tablist">
                                            <li class="nav-item" role="presentation"
                                                th:each="tab,st : ${homeTotalMedalBoard.tabs}">
                                                <button class="nav-link" 
                                                        th:classappend="${st.index == 0} ? ' active'"
                                                        data-bs-toggle="pill"
                                                        th:data-bs-target="|#homeTotalMedalSm_${tab.tabId}|" type="button"
                                                        role="tab" th:text="${tab.label}">等级</button>
                                            </li>
                                        </ul>
                                        <div class="tab-content">
                                            <div class="tab-pane fade"
                                                 th:each="tab,st : ${homeTotalMedalBoard.tabs}"
                                                 th:id="|homeTotalMedalSm_${tab.tabId}|"
                                                 th:classappend="${st.index == 0} ? ' show active'">
                                                <div class="table-responsive">
                                                    <table class="table table-sm table-hover mb-0">
                                                        <thead class="table-light">
                                                        <tr><th style="width:56px;" data-i18n-key="common.rank">排名</th><th data-i18n-key="common.player">选手</th><th style="width:62px;">🥇</th><th style="width:62px;">🥈</th><th style="width:62px;">🥉</th></tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr th:each="r,s : ${tab.rows}"
                                                            class="medal-board-row"
                                                            style="cursor:pointer;"
                                                            th:attr="data-board='total',data-level-code=${tab.code},data-user-id=${r.userId},data-username=${r.username}">
                                                            <td><span class="badge bg-primary" th:text="${s.index+1}">1</span></td>
                                                            <td><a th:href="@{/user/profile/{uid}(uid=${r.userId})}" class="text-decoration-none" onclick="event.stopPropagation();" th:text="${r.username}">选手</a></td>
                                                            <td th:text="${r.gold}">0</td>
                                                            <td th:text="${r.silver}">0</td>
                                                            <td th:text="${r.bronze}">0</td>
                                                        </tr>
                                                        <tr th:if="${#lists.isEmpty(tab.rows)}">
                                                            <td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td>
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                            <div th:if="${#lists.isEmpty(homeTotalMedalBoard.tabs)}" class="text-muted small" data-i18n-key="page.home.noRankData">暂无总奖牌榜数据</div>
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="homeMedalMobileSeason" role="tabpanel">
                                        <ul class="nav nav-pills nav-sm mb-2" role="tablist">
                                            <li class="nav-item" role="presentation"
                                                th:each="tab,st : ${homeSeasonMedalBoard['tabs']}">
                                                <button class="nav-link"
                                                        th:classappend="${st.index == 0} ? ' active'"
                                                        data-bs-toggle="pill"
                                                        th:data-bs-target="|#homeSeasonMedalSm_${tab.tabId}|" type="button"
                                                        role="tab" th:text="${tab.label}">等级</button>
                                            </li>
                                        </ul>
                                        <div class="tab-content">
                                            <div class="tab-pane fade"
                                                 th:each="tab,st : ${homeSeasonMedalBoard['tabs']}"
                                                 th:id="|homeSeasonMedalSm_${tab.tabId}|"
                                                 th:classappend="${st.index == 0} ? ' show active'">
                                                <div class="table-responsive">
                                                    <table class="table table-sm table-hover mb-0">
                                                        <thead class="table-light">
                                                        <tr><th style="width:56px;" data-i18n-key="common.rank">排名</th><th data-i18n-key="common.player">选手</th><th style="width:62px;">🥇</th><th style="width:62px;">🥈</th><th style="width:62px;">🥉</th></tr>
                                                        </thead>
                                                        <tbody>
                                                        <tr th:each="r,s : ${tab.rows}"
                                                            class="medal-board-row"
                                                            style="cursor:pointer;"
                                                            th:attr="data-board='season',data-level-code=${tab.code},data-user-id=${r.userId},data-username=${r.username}">
                                                            <td><span class="badge bg-primary" th:text="${s.index+1}">1</span></td>
                                                            <td><a th:href="@{/user/profile/{uid}(uid=${r.userId})}" class="text-decoration-none" onclick="event.stopPropagation();" th:text="${r.username}">选手</a></td>
                                                            <td th:text="${r.gold}">0</td>
                                                            <td th:text="${r.silver}">0</td>
                                                            <td th:text="${r.bronze}">0</td>
                                                        </tr>
                                                        <tr th:if="${#lists.isEmpty(tab.rows)}">
                                                            <td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td>
                                                        </tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                            <div th:if="${#lists.isEmpty(homeSeasonMedalBoard['tabs'])}" class="text-muted small" data-i18n-key="page.home.noSeasonData">暂无赛季奖牌榜数据</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>

    <div class="modal fade" id="homeMedalDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="homeMedalDetailTitle">奖牌榜计入明细</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="homeMedalDetailHint" class="small text-muted mb-2">加载中...</div>
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>赛季</th><th>系列</th><th>等级</th><th>名次</th><th style="width:120px;">操作</th>
                            </tr>
                            </thead>
                            <tbody id="homeMedalDetailRows">
                            <tr><td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <script>
        (() => {
            let medalDetailModal;
            const titleEl = () => document.getElementById('homeMedalDetailTitle');
            const hintEl = () => document.getElementById('homeMedalDetailHint');
            const rowsEl = () => document.getElementById('homeMedalDetailRows');

            function escapeHtml(v) {
                return String(v == null ? '' : v)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            async function openMedalRowDetail(tr) {
                const board = tr.getAttribute('data-board') || '';
                const levelCode = tr.getAttribute('data-level-code') || '';
                const userId = tr.getAttribute('data-user-id') || '';
                const username = tr.getAttribute('data-username') || '-';
                if (!board || !levelCode || !userId) return;
                if (!medalDetailModal) {
                    medalDetailModal = new bootstrap.Modal(document.getElementById('homeMedalDetailModal'));
                }
                if (titleEl()) titleEl().textContent = `${username} - 奖牌计入赛事`;
                if (hintEl()) hintEl().textContent = '加载中...';
                if (rowsEl()) rowsEl().innerHTML = '<tr><td colspan="5" class="text-center text-muted">加载中...</td></tr>';
                medalDetailModal.show();
                try {
                    const url = `/ranking/api/home/medal-contributions?boardType=${encodeURIComponent(board)}&levelCode=${encodeURIComponent(levelCode)}&userId=${encodeURIComponent(userId)}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if (!data.ok) {
                        if (hintEl()) hintEl().textContent = data.message || '加载失败';
                        if (rowsEl()) rowsEl().innerHTML = '<tr><td colspan="5" class="text-center text-muted">加载失败</td></tr>';
                        return;
                    }
                    const rows = Array.isArray(data.rows) ? data.rows : [];
                    if (hintEl()) hintEl().textContent = rows.length ? `共 ${rows.length} 场计入` : '该选手在当前榜单/等级暂无计入赛事';
                    if (!rowsEl()) return;
                    if (!rows.length) {
                        rowsEl().innerHTML = '<tr><td colspan="5" class="text-center text-muted" data-i18n-key="common.noData">暂无数据</td></tr>';
                        return;
                    }
                    rowsEl().innerHTML = rows.map(r => `
                        <tr>
                            <td>${escapeHtml(r.seasonLabel || '-')}</td>
                            <td>${escapeHtml(r.seriesLabel || '-')}</td>
                            <td>${escapeHtml(r.levelLabel || '-')}</td>
                            <td>${escapeHtml(r.rankLabel || '-')}</td>
                            <td><a class="btn btn-outline-secondary btn-sm" href="${escapeHtml(r.detailUrl || '#')}">赛事详情</a></td>
                        </tr>
                    `).join('');
                } catch (e) {
                    if (hintEl()) hintEl().textContent = e.message || '加载失败';
                    if (rowsEl()) rowsEl().innerHTML = '<tr><td colspan="5" class="text-center text-muted">加载失败</td></tr>';
                }
            }

            document.querySelectorAll('.medal-board-row').forEach((tr) => {
                tr.addEventListener('click', () => openMedalRowDetail(tr));
            });
        })();
    </script>
</body>
</html>
