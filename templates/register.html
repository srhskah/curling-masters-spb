<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('注册')}">
</head>
<body th:classappend="${ipBgClass}">
    <style>
        .register-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            background: white;
        }
    </style>
    <!-- 导航栏 -->
    <div th:replace="~{fragments :: navbar}"></div>

    <main id="main-content" tabindex="-1">
    <div class="container">
        <div class="register-container">
            <h1 class="h2 text-center mb-4" data-i18n-key="page.register.title">注册账号</h1>

            <!-- 显示错误消息 -->
            <div th:if="${error}" class="alert alert-danger" role="alert" aria-live="assertive" id="page-error-alert">
                <span th:text="${error}"></span>
            </div>

            <!-- 显示成功消息 -->
            <div th:if="${success}" class="alert alert-success" role="alert" aria-live="polite" id="page-success-alert">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/user/register}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n-key="page.register.usernameLabel">用户名 <small class="text-muted">(支持中文、emoji、Unicode字符)</small></label>
                    <input type="text" class="form-control" id="username" name="username" required
                           autocomplete="username"
                           placeholder="例如：张三、Dragon、🎯玩家、ユーザー"
                           aria-describedby="usernameHelp"
                           th:attr="aria-invalid=${error != null ? 'true' : null}">
                    <div class="form-text" id="usernameHelp">用户名包含"admin"将自动设为超级管理员（仅限一个）</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label" data-i18n-key="page.register.email">邮箱</label>
                    <input type="email" class="form-control" id="email" name="email" required
                           autocomplete="email"
                           th:attr="aria-invalid=${error != null ? 'true' : null}">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n-key="page.register.password">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6"
                           autocomplete="new-password"
                           aria-describedby="passwordHelp"
                           th:attr="aria-invalid=${error != null ? 'true' : null}">
                    <div class="form-text" id="passwordHelp">密码至少6位</div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label" data-i18n-key="page.register.confirmPassword">确认密码</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                           autocomplete="new-password">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success" data-i18n-key="page.register.registerBtn">注册</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p><span data-i18n-key="page.register.hasAccount">已有账号？</span><a href="/user/login" data-i18n-key="page.register.loginNow">立即登录</a></p>
            </div>
        </div>
    </div>
    </main>

    <!-- 页脚 -->
    <div th:replace="~{fragments :: footer}"></div>

    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <script>
        // 简单的密码确认验证
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('两次输入的密码不一致');
            }
        });
    </script>
</body>
</html>
