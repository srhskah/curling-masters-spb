<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('禁止报名记录')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>

<div th:replace="~{fragments :: success-alert}"></div>
<div th:replace="~{fragments :: error-alert}"></div>

<div class="container mt-4">
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-primary text-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h5 class="mb-0"><i class="bi bi-ban"></i> 禁止报名记录</h5>
            <a class="btn btn-light btn-sm" href="/user/manage">
                <i class="bi bi-arrow-left"></i> 返回用户管理
            </a>
        </div>
        <div class="card-body">
            <div class="admin-action-legend text-muted mb-2">
                <span class="legend-item fw-semibold">操作图例</span>
                <span class="legend-item"><i class="bi bi-trash"></i> 解除</span>
                <span class="legend-item">总决赛=是否禁止赛季/年终总决赛</span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle admin-mgmt-table">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>用户</th>
                            <th>禁止类型</th>
                            <th>目标</th>
                            <th>数量</th>
                            <th title="是否禁止赛季总决赛/年终总决赛">总决赛</th>
                            <th>理由</th>
                            <th>操作人</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ban : ${bans}">
                            <td th:text="${ban.id}"></td>
                            <td th:text="${ban.username}"></td>
                            <td>
                                <span th:if="${ban.banType == 'FUTURE_TOURNAMENTS_BY_LEVEL'}" class="badge bg-info">往后N届特定等级赛事</span>
                                <span th:if="${ban.banType == 'FUTURE_SERIES_ALL'}" class="badge bg-info">往后N个系列所有赛事</span>
                                <span th:if="${ban.banType == 'SEASON_ALL_BY_LEVEL'}" class="badge bg-warning">本赛季特定等级所有赛事</span>
                                <span th:if="${ban.banType == 'SEASON_ALL'}" class="badge bg-warning">本赛季所有赛事</span>
                                <span th:if="${ban.banType == 'YEAR_ALL'}" class="badge bg-danger">本年度所有赛事</span>
                            </td>
                            <td>
                                <div th:if="${ban.targetLevelCode != null}">
                                    <small>赛事等级：<span th:text="${ban.targetLevelCode}"></span></small>
                                </div>
                                <div th:if="${ban.targetSeasonId != null}">
                                    <small>赛季ID：<span th:text="${ban.targetSeasonId}"></span></small>
                                </div>
                                <div th:if="${ban.targetYear != null}">
                                    <small>年份：<span th:text="${ban.targetYear}"></span></small>
                                </div>
                            </td>
                            <td th:text="${ban.banCount}"></td>
                            <td>
                                <span th:if="${ban.banFinalTournament}" class="badge bg-danger">是</span>
                                <span th:if="${!ban.banFinalTournament}" class="badge bg-secondary">否</span>
                            </td>
                            <td>
                                <small th:text="${ban.reason}" class="text-muted"></small>
                            </td>
                            <td th:text="${ban.createdByUsername}"></td>
                            <td th:text="${#temporals.format(ban.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <div class="btn-group generic-list-actions" role="group">
                                    <button class="btn btn-sm btn-outline-danger" title="解除" aria-label="解除"
                                            th:onclick="'removeBan(' + ${ban.id} + ')'">
                                        <i class="bi bi-trash"></i><span class="generic-action-label"> 解除</span>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${bans == null or #lists.isEmpty(bans)}" class="text-center text-muted py-4">
                <i class="bi bi-inbox fs-1"></i>
                <p class="mt-2 mb-0">暂无禁止报名记录</p>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script>
    function removeBan(banId) {
        if (!confirm('确定要解除该禁止报名记录吗？')) {
            return;
        }

        const getCookie = (name) => {
            const match = document.cookie.match(new RegExp('(^|; )' + name + '=([^;]*)'));
            return match ? decodeURIComponent(match[2]) : null;
        };
        const csrfToken = getCookie('XSRF-TOKEN');

        fetch('/user/registration-ban/remove/' + banId, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRF-TOKEN': csrfToken
            },
            body: '_csrf=' + encodeURIComponent(csrfToken)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                location.reload();
            } else {
                alert('解除失败：' + data.message);
            }
        })
        .catch(error => {
            alert('解除失败：' + error.message);
        });
    }
</script>
</body>
</html>
