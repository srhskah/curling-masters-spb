<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('重置密码')}">
</head>
<body th:classappend="${ipBgClass}">
    <style>
        .reset-container {
            max-width: 400px;
            margin: 5rem auto;
            padding: 2rem;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            border-radius: 10px;
            background: white;
        }
    </style>
    <div th:replace="~{fragments :: navbar}"></div>

    <main id="main-content" tabindex="-1">
    <div class="container">
        <div class="reset-container">
            <h1 class="h2 text-center mb-4" data-i18n-key="page.resetPassword.title">重置密码</h1>

            <!-- 显示错误消息 -->
            <div th:if="${error}" class="alert alert-danger" role="alert" aria-live="assertive" id="page-error-alert">
                <span th:text="${error}"></span>
            </div>

            <!-- 显示成功消息 -->
            <div th:if="${success}" class="alert alert-success" role="alert" aria-live="polite" id="page-success-alert">
                <span th:text="${success}"></span>
            </div>

            <form th:action="@{/user/reset-password}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label for="newPassword" class="form-label" data-i18n-key="page.changePassword.newPassword">新密码</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" required minlength="6"
                           autocomplete="new-password"
                           aria-describedby="resetPasswordHelp"
                           th:attr="aria-invalid=${error != null ? 'true' : null}">
                    <div class="form-text" id="resetPasswordHelp">密码至少6位，不能与当前密码相同</div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label" data-i18n-key="page.changePassword.confirmPassword">确认新密码</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required
                           autocomplete="new-password">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning" data-i18n-key="page.resetPassword.submit">重置密码</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="btn btn-secondary" data-i18n-key="page.resetPassword.backHome">返回首页</a>
            </div>
        </div>
    </div>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
    <th:block th:replace="~{fragments :: scripts}"></th:block>
    <script>
        // 简单的密码确认验证
        document.querySelector('form').addEventListener('submit', function(e) {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                e.preventDefault();
                alert('两次输入的密码不一致');
            }
        });
    </script>
</body>
</html>
