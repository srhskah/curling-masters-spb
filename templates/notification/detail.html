<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('通知详情')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: error-alert}"></div>
<div th:replace="~{fragments :: success-alert}"></div>
<div class="container mt-4" th:if="${notice != null}">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0">
            <span th:text="${notice.title}">通知标题</span>
            <span th:if="${notice.pinned}" class="badge bg-danger align-middle ms-1">置顶</span>
        </h3>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-secondary btn-sm btn-mobile-compact" th:href="@{/notification/list}">
                <span class="btn-label">返回列表</span><span class="btn-emoji" aria-hidden="true">↩️</span>
            </a>
            <a th:replace="~{fragments :: btn-export-pdf('btn btn-outline-dark btn-sm', @{/notification/export/pdf/{id}(id=${notice.id})}, null)}"></a>
            <form method="post" th:action="@{/notification/mark-unread/{id}(id=${notice.id})}">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-warning btn-sm btn-mobile-compact">
                    <span class="btn-label">标记未读</span><span class="btn-emoji" aria-hidden="true">🔔</span>
                </button>
            </form>
            <button th:replace="~{fragments :: btn-copy-as-text('btn btn-outline-dark btn-sm', '#copyText', 1200, null)}"></button>
        </div>
    </div>
    <div class="text-muted small mb-3">
        <span th:text="${notice.publishedAt != null ? #temporals.format(notice.publishedAt,'yyyy-MM-dd HH:mm:ss') : '-'}">时间</span>
        <span th:if="${notice.authorUsername != null}"> · 发起者：<span th:text="${notice.authorUsername}">用户</span></span>
        <span> · 类型：<span th:text="${notice.sendTypeLabel != null ? notice.sendTypeLabel : (isAutoGenerated ? '自动' : '手动')}">手动</span></span>
        <span th:if="${notice.tournamentEditionLabel != null and !#strings.isEmpty(notice.tournamentEditionLabel)}">
            · 关联赛事：<span th:text="${notice.tournamentEditionLabel}">赛季-等级-届次</span>
        </span>
        <span th:if="${notice.tournamentDetailUrl != null and !#strings.isEmpty(notice.tournamentDetailUrl)}">
            · <a th:href="${notice.tournamentDetailUrl}">前往赛事详情</a>
        </span>
    </div>

    <div th:if="${notice.sourceType == 'FORGOT_PASSWORD' and isManager}" class="card border-primary mb-3">
        <div class="card-body">
            <h5 class="card-title">重置密码操作</h5>
            <div id="resetPasswordSection"></div>
        </div>
    </div>
    <article class="card border-0 shadow-sm" th:classappend="${notice.pinned} ? ' border-warning' : ''">
        <div class="card-body markdown-body" th:utext="${notice.contentHtml}"></div>
    </article>

    <div class="mt-3 d-flex gap-2 flex-wrap">
        <a th:if="${canEditThis}" class="btn btn-sm btn-warning"
           th:href="@{/notification/edit/{id}(id=${notice.id})}">编辑</a>
        <button th:if="${canTogglePin}" type="button" class="btn btn-sm"
                th:classappend="${notice.pinned} ? 'btn-outline-secondary' : 'btn-outline-warning'"
                th:attr="data-pin-id=${notice.id},data-pin-to=${notice.pinned ? 'false' : 'true'},data-pin-title=${notice.title}"
                onclick="openDetailPinModal(this)">
            <span th:text="${notice.pinned} ? '取消置顶' : '置顶'">置顶</span>
        </button>
        <button th:if="${canDeleteThis}" type="button" class="btn btn-sm btn-outline-danger"
                data-bs-toggle="modal" data-bs-target="#deleteNotificationModal">删除</button>
    </div>

    <div class="mt-4">
        <h5 class="mb-2">修改记录</h5>
        <div class="table-responsive">
            <table class="table table-sm table-bordered align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>时间</th>
                    <th>操作</th>
                    <th>编辑者</th>
                    <th>变更摘要</th>
                    <th>签名</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${editLogs == null or #lists.isEmpty(editLogs)}">
                    <td colspan="5" class="text-muted">暂无修改记录</td>
                </tr>
                <tr th:each="log : ${editLogs}">
                    <td class="text-nowrap"
                        th:text="${log.editedAt != null ? #temporals.format(log.editedAt,'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                    <td th:text="${log.action}">UPDATE</td>
                    <td th:text="${log.editorUsername}">—</td>
                    <td class="small">
                        <div th:if="${log.oldTitle != log.newTitle}">
                            标题：<span th:text="${log.oldTitle}">旧</span> → <span th:text="${log.newTitle}">新</span>
                        </div>
                        <div th:if="${log.oldPinned != log.newPinned}">
                            置顶：<span th:text="${log.oldPinned}">否</span> → <span th:text="${log.newPinned}">是</span>
                        </div>
                        <div th:if="${log.oldPublishToHome != log.newPublishToHome}">
                            首页：<span th:text="${log.oldPublishToHome}">否</span> → <span th:text="${log.newPublishToHome}">是</span>
                        </div>
                        <div th:if="${log.oldPublished != log.newPublished}">
                            发布：<span th:text="${log.oldPublished}">否</span> → <span th:text="${log.newPublished}">是</span>
                        </div>
                        <div th:if="${log.oldContentMarkdown != log.newContentMarkdown}">正文已更新</div>
                        <div th:if="${log.action == 'CREATE'}">新建通知</div>
                    </td>
                    <td>
                        <img th:if="${log.signature != null and #strings.startsWith(log.signature, 'data:image/')}"
                             th:src="${log.signature}" alt="签名" style="max-height:48px;background:#fff;"/>
                        <span th:if="${log.signature == null or #strings.isEmpty(log.signature)}" class="text-muted">无</span>
                        <span th:if="${log.signature != null and !#strings.isEmpty(log.signature) and !#strings.startsWith(log.signature, 'data:image/')}"
                              th:text="${log.signature}">签</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="pinNotificationModal" tabindex="-1" aria-hidden="true" th:if="${canTogglePin}">
    <div class="modal-dialog">
        <form class="modal-content" method="post" id="pinNotificationForm"
              th:action="@{/notification/pin/{id}(id=${notice.id})}"
              onsubmit="return requireSignatureBeforeSubmit(this);">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="pinned" id="pinTargetValue" value="true"/>
            <input type="hidden" name="from" value="detail"/>
            <input type="hidden" name="signature" id="pinSignature" value=""/>
            <div class="modal-header">
                <h5 class="modal-title" id="pinModalTitle">置顶消息通知</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2 small text-muted" id="pinModalHint">请签字验收后确认。</p>
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        onclick="openSignatureModal(document.getElementById('pinSignature'))">手写电子签名</button>
                <span data-sig-hint class="small text-danger ms-2">必须签字</span>
                <div class="mt-2">
                    <img data-sig-preview class="d-none border rounded" alt="签名预览" style="max-height:80px;background:#fff;"/>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary" id="pinModalSubmit">确认</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="deleteNotificationModal" tabindex="-1" aria-hidden="true" th:if="${canDeleteThis}">
    <div class="modal-dialog">
        <form class="modal-content" method="post" th:action="@{/notification/delete/{id}(id=${notice.id})}"
              onsubmit="return requireSignatureBeforeSubmit(this);">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="signature" id="signature" value=""/>
            <div class="modal-header">
                <h5 class="modal-title">删除消息通知</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-2">删除后不可恢复，将写入删除记录。请先签字验收。</p>
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        onclick="openSignatureModal(document.getElementById('signature'))">手写电子签名</button>
                <span data-sig-hint class="small text-danger ms-2">必须签字</span>
                <div class="mt-2">
                    <img data-sig-preview class="d-none border rounded" alt="签名预览" style="max-height:80px;background:#fff;"/>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-danger">确认删除</button>
            </div>
        </form>
    </div>
</div>

<textarea id="copyText" class="d-none" th:text="${copyText}"></textarea>
<div th:replace="~{fragments :: signature-modal}"></div>
<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/signature-pad.js}"></script>
<script th:if="${canTogglePin}">
    let detailPinModal = null;
    function openDetailPinModal(btn) {
        if (!btn) return;
        const pinTo = String(btn.getAttribute('data-pin-to') || 'true') === 'true';
        const title = btn.getAttribute('data-pin-title') || '';
        const form = document.getElementById('pinNotificationForm');
        const modalEl = document.getElementById('pinNotificationModal');
        if (!form || !modalEl) return;
        document.getElementById('pinTargetValue').value = pinTo ? 'true' : 'false';
        document.getElementById('pinModalTitle').textContent = pinTo ? '置顶消息通知' : '取消置顶';
        document.getElementById('pinModalHint').textContent =
            (pinTo ? '将置顶：' : '将取消置顶：') + title + '。请签字验收后确认。';
        document.getElementById('pinModalSubmit').textContent = pinTo ? '确认置顶' : '确认取消置顶';
        const sig = document.getElementById('pinSignature');
        if (sig) sig.value = '';
        const preview = form.querySelector('[data-sig-preview]');
        if (preview) { preview.src = ''; preview.classList.add('d-none'); }
        const hint = form.querySelector('[data-sig-hint]');
        if (hint) {
            hint.textContent = '必须签字';
            hint.classList.add('text-danger');
            hint.classList.remove('text-success');
        }
        if (!detailPinModal) detailPinModal = new bootstrap.Modal(modalEl);
        detailPinModal.show();
    }
</script>
<script th:if="${notice.sourceType == 'FORGOT_PASSWORD' and isManager}">
    function loadResetPasswordStatus() {
        fetch('/notification/reset-password-status/' + [[${notice.id}]])
            .then(response => response.json())
            .then(data => {
                const section = document.getElementById('resetPasswordSection');
                if (data.status === 'PENDING') {
                    section.innerHTML = `<p class="text-muted">该用户的密码尚未重置</p><button class="btn btn-warning" onclick="resetPassword()">重置密码</button>`;
                } else if (data.status === 'RESET_BY_ME') {
                    section.innerHTML = `<p class="text-success">您已于 ${data.resetTime} 重置了该用户的密码</p><p class="text-muted">新密码：123456</p>`;
                } else if (data.status === 'RESET_BY_OTHER') {
                    section.innerHTML = `<p class="text-warning">密码已由管理员 <strong>${data.resetBy}</strong> 于 ${data.resetTime} 重置</p><p class="text-muted">新密码：123456</p>`;
                } else {
                    section.innerHTML = '<p class="text-muted">无法获取重置密码状态</p>';
                }
            })
            .catch(() => {
                document.getElementById('resetPasswordSection').innerHTML = '<p class="text-danger">加载状态失败</p>';
            });
    }
    function resetPassword() {
        if (!confirm('确定要重置该用户的密码为 123456 吗？')) return;
        const csrfToken = document.querySelector('input[name="_csrf"]')?.value;
        fetch('/notification/reset-password/' + [[${notice.id}]], {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRF-TOKEN': csrfToken },
            body: '_csrf=' + encodeURIComponent(csrfToken || '')
        }).then(r => r.json()).then(data => {
            if (data.success) { alert('密码重置成功！新密码：123456'); loadResetPasswordStatus(); }
            else alert('重置失败：' + data.message);
        });
    }
    loadResetPasswordStatus();
</script>
</body>
</html>
