<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('消息通知')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: error-alert}"></div>
<div th:replace="~{fragments :: success-alert}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0">消息通知</h3>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <form th:if="${unreadCount != null and unreadCount > 0}"
                  method="post"
                  th:action="@{/notification/mark-all-read}"
                  class="d-inline"
                  onsubmit="return confirm('确定将全部未读消息标为已读？');">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-secondary btn-sm btn-mobile-compact">
                    <i class="bi bi-check2-all"></i>
                    <span class="btn-label">一键已读全部</span>
                </button>
            </form>
            <a th:if="${isManager}" class="btn btn-primary btn-sm btn-mobile-compact" href="/notification/edit">
                <span class="btn-label">新建通知</span><span class="btn-emoji" aria-hidden="true">➕</span>
            </a>
        </div>
    </div>

    <div class="notification-rss-bar mb-3">
        <div class="small text-muted mb-1">RSS 订阅（有新消息通知即可拉取）</div>
        <div class="alert alert-warning py-2 px-3 small mb-2" th:if="${rssUrlLooksLocal}">
            当前订阅地址像是本机/内网（如 <code>127.0.0.1</code>）。Feedly 等外网平台<strong>拉不到</strong>这类地址。
            请用公网域名打开本站后再复制订阅链接，或在环境变量配置
            <code>APP_PUBLIC_BASE_URL=https://你的域名</code> 后重启。
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <a class="btn btn-outline-secondary btn-sm btn-mobile-compact"
               th:href="${publicRssUrl}"
               rel="alternate"
               type="application/rss+xml"
               target="_blank">
                <i class="bi bi-rss"></i>
                <span class="btn-label">公共订阅源</span>
            </a>
            <a th:if="${personalRssUrl != null}"
               class="btn btn-outline-secondary btn-sm btn-mobile-compact"
               th:href="${personalRssUrl}"
               rel="alternate"
               type="application/rss+xml"
               target="_blank">
                <i class="bi bi-rss-fill"></i>
                <span class="btn-label">我的专属订阅源</span>
            </a>
            <span th:if="${personalRssUrl == null}" class="small text-muted">登录后可获取专属订阅源（按权限与已报名赛事）</span>
        </div>
        <!-- <div class="small text-muted mt-2 text-break">
            公共地址：
            <code th:text="${publicRssUrl}">https://…/notification/rss/public.xml</code>
        </div> -->
        <!-- <div th:if="${personalRssUrl != null}" class="small text-muted mt-1 text-break">
            专属地址（请勿泄露）：
            <code th:text="${personalRssUrl}">https://…/notification/rss/u/….xml</code>
        </div> -->
    </div>

    <div class="list-group" th:if="${items != null and !#lists.isEmpty(items)}">
        <a class="list-group-item list-group-item-action"
           th:each="m : ${items}"
           th:href="@{/notification/detail/{id}(id=${m.id})}">
            <div class="d-flex justify-content-between">
                <div>
                    <strong th:text="${m.title}">标题</strong>
                    <small class="text-muted d-block mt-1" th:if="${m.authorUsername != null}"
                           th:text="${'发起者：' + m.authorUsername}">发起者</small>
                    <small class="text-primary d-block mt-1"
                           th:if="${m.tournamentEditionLabel != null and !#strings.isEmpty(m.tournamentEditionLabel)}"
                           th:text="${'关联赛事：' + m.tournamentEditionLabel}">关联赛事</small>
                </div>
                <small class="text-muted text-nowrap ms-2" th:text="${m.publishedAt != null ? #temporals.format(m.publishedAt,'yyyy-MM-dd HH:mm') : '-'}">时间</small>
            </div>
        </a>
    </div>
    <div class="text-muted" th:if="${items == null or #lists.isEmpty(items)}">暂无消息。</div>
</div>
<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
