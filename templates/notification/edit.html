<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${isEdit} ? '编辑通知' : '新建通知')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: error-alert}"></div>
<div class="container mt-4">
    <h3 class="mb-3" th:text="${isEdit} ? '编辑通知' : '新建通知'">新建通知</h3>
    <div class="alert alert-warning py-2" th:if="${isAutoGenerated}">
        自动生成的消息通知不可手动编辑内容。
    </div>
    <form method="post" th:action="@{/notification/save}" id="notificationEditForm"
          onsubmit="return requireSignatureBeforeSubmit(this);">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="id" th:value="${message.id}"/>
        <input type="hidden" name="signature" id="signature" value=""/>
        <div class="mb-3">
            <label class="form-label">标题</label>
            <input name="title" class="form-control" required th:value="${message.title}"
                   th:disabled="${isAutoGenerated}"/>
        </div>
        <div class="mb-3 text-muted small" th:if="${isEdit and message.authorUsername != null}">
            发起者：<span th:text="${message.authorUsername}">—</span>
            <span th:if="${message.sendTypeLabel != null}"> · 类型：<span th:text="${message.sendTypeLabel}">手动</span></span>
        </div>
        <div class="mb-3">
            <label class="form-label">正文（Markdown）</label>
            <p class="form-text text-muted small mb-2">
                可在「Markdown / 所见即所得」间切换。换行、Tab 列表缩进、超链接、表格等保存后按 GFM 渲染；
                所见即所得往返时会自动展开 Tab、修复表格转义/粘连行，并在有序项下缩进子列表。
            </p>
            <div class="notification-md-editor-wrap">
                <textarea id="contentMarkdown" name="contentMarkdown" class="form-control" rows="12"
                          th:text="${message.contentMarkdown}" th:disabled="${isAutoGenerated}"></textarea>
            </div>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" id="publishToHome" type="checkbox" name="publishToHome" value="true"
                   th:checked="${message.publishToHome}" th:disabled="${isAutoGenerated}">
            <label class="form-check-label" for="publishToHome">发布到首页模块</label>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" id="publishNow" type="checkbox" name="publishNow" value="true"
                   th:checked="${message.published}" th:disabled="${isAutoGenerated}">
            <label class="form-check-label" for="publishNow">立即发布</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" id="pinned" type="checkbox" name="pinned" value="true"
                   th:checked="${message.pinned}" th:disabled="${isAutoGenerated}">
            <label class="form-check-label" for="pinned">置顶（列表与首页前置高亮）</label>
        </div>
        <div class="mb-3 p-3 border rounded">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <button type="button" class="btn btn-outline-secondary btn-sm"
                        onclick="openSignatureModal(document.getElementById('signature'))">手写电子签名</button>
                <span data-sig-hint class="small text-danger">保存前必须签字验收</span>
            </div>
            <img data-sig-preview class="d-none border rounded" alt="签名预览" style="max-height:80px;background:#fff;"/>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-primary" type="submit" th:disabled="${isAutoGenerated}">保存</button>
            <a class="btn btn-outline-secondary" th:href="@{/notification/list}">取消</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments :: signature-modal}"></div>
<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<script th:src="@{/js/signature-pad.js?v=4}"></script>
<link rel="stylesheet" th:href="@{/css/toastui-editor.min.css}"/>
<script th:src="@{/js/toastui-editor-all.min.js}"></script>
<script th:inline="javascript">
    (() => {
        const disabled = /*[[${isAutoGenerated}]]*/ false;
        const ta = document.getElementById('contentMarkdown');
        if (!ta || disabled || typeof toastui === 'undefined') return;
        const form = ta.closest('form');
        const editorEl = document.createElement('div');
        ta.parentNode.insertBefore(editorEl, ta);
        ta.classList.add('d-none');

        const expandTabs = (md, tabWidth) => {
            const tw = tabWidth > 0 ? tabWidth : 4;
            return String(md == null ? '' : md).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').map((line) => {
                let col = 0;
                let out = '';
                for (let i = 0; i < line.length; i++) {
                    const ch = line.charAt(i);
                    if (ch === '\t') {
                        const spaces = tw - (col % tw);
                        out += ' '.repeat(spaces);
                        col += spaces;
                    } else {
                        out += ch;
                        col++;
                    }
                }
                return out;
            }).join('\n');
        };

        const repairMarkdownTables = (md) => {
            if (md == null || md === '') return md == null ? '' : md;
            const unescapeLine = (line) => line
                .replace(/\\\|/g, '|')
                .replace(/\\-/g, '-')
                .replace(/\\,/g, ',')
                .replace(/\\\+/g, '+')
                .replace(/\\\./g, '.')
                .replace(/\\!/g, '!')
                .replace(/\\#/g, '#')
                .replace(/\\\(/g, '(')
                .replace(/\\\)/g, ')')
                .replace(/\\\[/g, '[')
                .replace(/\\\]/g, ']');
            const isSep = (c) => /^:?-{3,}:?$/.test(c || '');
            const formatRow = (cells) => '| ' + cells.map((c) => c || '').join(' | ') + ' |';
            const countPipes = (s) => {
                let n = 0;
                for (let i = 0; i < s.length; i++) if (s.charAt(i) === '|') n++;
                return n;
            };
            const looksLikeCollapsed = (t) => {
                if (!t || t.charAt(0) !== '|' || countPipes(t) < 6) return false;
                return t.includes('---') || t.includes(':--') || t.includes('--:');
            };
            const expandTableSegment = (t) => {
                if (!looksLikeCollapsed(t)) return t;
                const parts = t.split('|');
                if (parts.length < 5) return t;
                let trailingNote = (parts[parts.length - 1] || '').trim();
                const cells = [];
                for (let i = 1; i < parts.length - 1; i++) cells.push((parts[i] || '').trim());
                if (cells.length < 4) return t;
                let i = 0;
                while (i < cells.length && !cells[i]) i++;
                const header = [];
                while (i < cells.length && !isSep(cells[i])) { header.push(cells[i]); i++; }
                while (header.length && !header[header.length - 1]) header.pop();
                const cols = header.length;
                if (cols < 2 || i >= cells.length) return t;
                while (i < cells.length && !cells[i]) i++;
                if (i + cols > cells.length) return t;
                const sepRow = [];
                for (let k = 0; k < cols; k++) {
                    if (!isSep(cells[i + k])) return t;
                    sepRow.push(cells[i + k]);
                }
                i += cols;
                const rows = [formatRow(header), formatRow(sepRow)];
                while (i < cells.length) {
                    while (i < cells.length && !cells[i]) i++;
                    if (i >= cells.length) break;
                    if (i + cols > cells.length) {
                        const leftover = cells.slice(i).filter(Boolean).join(' ').trim();
                        if (leftover) trailingNote = (trailingNote ? trailingNote + ' ' : '') + leftover;
                        break;
                    }
                    rows.push(formatRow(cells.slice(i, i + cols)));
                    i += cols;
                }
                let out = rows.join('\n');
                if (trailingNote) out += '\n\n' + trailingNote;
                return out;
            };
            const splitCollapsed = (line) => {
                let from = 0;
                let tableAt = -1;
                while (from < line.length) {
                    const pipe = line.indexOf('|', from);
                    if (pipe < 0) break;
                    const candidate = line.slice(pipe).trimStart();
                    if (looksLikeCollapsed(candidate)) {
                        tableAt = pipe;
                        while (tableAt < line.length && /\s/.test(line.charAt(tableAt))) tableAt++;
                        break;
                    }
                    from = pipe + 1;
                }
                if (tableAt < 0) return line;
                const prose = tableAt > 0 ? line.slice(0, tableAt).replace(/\s+$/, '') : '';
                const expanded = expandTableSegment(line.slice(tableAt).trimStart());
                if (expanded.indexOf('\n') < 0) return line;
                return prose ? (prose + '\n\n' + expanded) : expanded;
            };
            // 有序项后紧跟顶格无序项 → 缩进为子列表（对齐服务端 nestTightUnorderedUnderPrecedingOrdered）
            const nestUlUnderOl = (text) => {
                const lines = text.split('\n');
                let underOrdered = false;
                return lines.map((line) => {
                    if (!line.trim()) {
                        underOrdered = false;
                        return line;
                    }
                    if (/^\d{1,3}\.\s+\S/.test(line)) {
                        underOrdered = true;
                        return line;
                    }
                    if (underOrdered && /^[-*+]\s+\S/.test(line)) {
                        return '    ' + line.trimStart();
                    }
                    if (underOrdered && line.startsWith('    ')) {
                        return line;
                    }
                    underOrdered = false;
                    return line;
                }).join('\n');
            };
            let inFence = false;
            let out = expandTabs(md, 4).split('\n').map((line) => {
                const trimmed = line.trimStart();
                if (trimmed.startsWith('```')) {
                    inFence = !inFence;
                    return line;
                }
                if (inFence) return line;
                return splitCollapsed(unescapeLine(line));
            }).join('\n');
            out = nestUlUnderOl(out);
            return out;
        };

        const initial = repairMarkdownTables(ta.value || '');
        ta.value = initial;
        const editor = new toastui.Editor({
            el: editorEl,
            height: '420px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            hideModeSwitch: false,
            usageStatistics: false,
            initialValue: initial
        });
        let repairing = false;
        const syncMarkdownToTextarea = (opts) => {
            const rewriteEditor = !opts || opts.rewriteEditor !== false;
            let md = editor.getMarkdown();
            md = repairMarkdownTables(md != null ? md : '');
            ta.value = md;
            if (!rewriteEditor || repairing) return md;
            const cur = editor.getMarkdown();
            if (md !== (cur != null ? cur : '')) {
                repairing = true;
                try { editor.setMarkdown(md); } finally { repairing = false; }
            }
            return md;
        };
        if (typeof editor.on === 'function') {
            editor.on('changeMode', () => setTimeout(() => syncMarkdownToTextarea({ rewriteEditor: true }), 0));
            editor.on('blur', () => syncMarkdownToTextarea({ rewriteEditor: false }));
        }
        form.addEventListener('submit', () => syncMarkdownToTextarea({ rewriteEditor: true }), true);
        form.addEventListener('submit', () => syncMarkdownToTextarea({ rewriteEditor: false }), false);
    })();
</script>
</body>
</html>
