<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${isEdit} ? '编辑通知' : '新建通知')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>
<div class="container mt-4">
    <h3 class="mb-3" th:text="${isEdit} ? '编辑通知' : '新建通知'">新建通知</h3>
    <form method="post" action="/notification/save">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" name="id" th:value="${message.id}"/>
        <div class="mb-3">
            <label class="form-label">标题</label>
            <input name="title" class="form-control" required th:value="${message.title}"/>
        </div>
        <div class="mb-3 text-muted small" th:if="${isEdit and message.authorUsername != null}">
            发起者：<span th:text="${message.authorUsername}">—</span>
        </div>
        <div class="mb-3">
            <label class="form-label">正文（Markdown）</label>
            <p class="form-text text-muted small mb-2">请使用 Markdown 模式编辑表格（已关闭所见即所得切换，避免表格换行丢失与字符被转义）。</p>
            <div class="notification-md-editor-wrap">
                <textarea id="contentMarkdown" name="contentMarkdown" class="form-control" rows="12" th:text="${message.contentMarkdown}"></textarea>
            </div>
        </div>
        <div class="form-check mb-2">
            <input class="form-check-input" id="publishToHome" type="checkbox" name="publishToHome" value="true" th:checked="${message.publishToHome}">
            <label class="form-check-label" for="publishToHome">发布到首页模块</label>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" id="publishNow" type="checkbox" name="publishNow" value="true" th:checked="${message.published}">
            <label class="form-check-label" for="publishNow">立即发布</label>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">保存</button>
            <a class="btn btn-outline-secondary" href="/notification/list">取消</a>
        </div>
    </form>
</div>
<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
<link rel="stylesheet" th:href="@{/css/toastui-editor.min.css}"/>
<script th:src="@{/js/toastui-editor-all.min.js}"></script>
<script>
    (() => {
        const ta = document.getElementById('contentMarkdown');
        if (!ta || typeof toastui === 'undefined') return;
        const form = ta.closest('form');
        const editorEl = document.createElement('div');
        ta.parentNode.insertBefore(editorEl, ta);
        ta.classList.add('d-none');

        /** 还原 Toast 过度转义，并把被粘成一行的 GFM 表按单元格重组成多行（与后端 MarkdownUtils 对齐）。 */
        const repairMarkdownTables = (md) => {
            if (md == null || md === '') return md == null ? '' : md;
            const unescapeLine = (line) => line
                .replace(/\\\|/g, '|')
                .replace(/\\-/g, '-')
                .replace(/\\,/g, ',')
                .replace(/\\\+/g, '+')
                .replace(/\\\./g, '.')
                .replace(/\\!/g, '!')
                .replace(/\\#/g, '#')
                .replace(/\\\(/g, '(')
                .replace(/\\\)/g, ')')
                .replace(/\\\[/g, '[')
                .replace(/\\\]/g, ']');
            const isSep = (c) => /^:?-{3,}:?$/.test(c || '');
            const formatRow = (cells) => '| ' + cells.map((c) => c || '').join(' | ') + ' |';
            const splitCollapsed = (line) => {
                const t = line.trimStart();
                if (!t.startsWith('|')) return line;
                let pipes = 0;
                for (let i = 0; i < t.length; i++) if (t.charAt(i) === '|') pipes++;
                if (pipes < 6) return line;
                if (!t.includes('---') && !t.includes(':--') && !t.includes('--:')) return line;
                const parts = t.split('|');
                if (parts.length < 5) return line;
                let trailingNote = (parts[parts.length - 1] || '').trim();
                const cells = [];
                for (let i = 1; i < parts.length - 1; i++) cells.push((parts[i] || '').trim());
                if (cells.length < 4) return line;
                let i = 0;
                while (i < cells.length && !cells[i]) i++;
                const header = [];
                while (i < cells.length && !isSep(cells[i])) { header.push(cells[i]); i++; }
                while (header.length && !header[header.length - 1]) header.pop();
                const cols = header.length;
                if (cols < 2 || i >= cells.length) return line;
                while (i < cells.length && !cells[i]) i++;
                if (i + cols > cells.length) return line;
                const sepRow = [];
                for (let k = 0; k < cols; k++) {
                    if (!isSep(cells[i + k])) return line;
                    sepRow.push(cells[i + k]);
                }
                i += cols;
                const rows = [formatRow(header), formatRow(sepRow)];
                while (i < cells.length) {
                    while (i < cells.length && !cells[i]) i++;
                    if (i >= cells.length) break;
                    if (i + cols > cells.length) {
                        const leftover = cells.slice(i).filter(Boolean).join(' ').trim();
                        if (leftover) trailingNote = (trailingNote ? trailingNote + ' ' : '') + leftover;
                        break;
                    }
                    rows.push(formatRow(cells.slice(i, i + cols)));
                    i += cols;
                }
                let out = rows.join('\n');
                if (trailingNote) out += '\n\n' + trailingNote;
                return out;
            };
            let inFence = false;
            return md.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').map((line) => {
                const trimmed = line.trimStart();
                if (trimmed.startsWith('```')) {
                    inFence = !inFence;
                    return line;
                }
                if (inFence) return line;
                return splitCollapsed(unescapeLine(line));
            }).join('\n');
        };

        const initial = repairMarkdownTables(ta.value || '');
        ta.value = initial;

        const editor = new toastui.Editor({
            el: editorEl,
            height: '420px',
            initialEditType: 'markdown',
            previewStyle: 'vertical',
            hideModeSwitch: true,
            initialValue: initial
        });
        const syncMarkdownToTextarea = () => {
            let md = editor.getMarkdown();
            md = repairMarkdownTables(md != null ? md : '');
            ta.value = md;
        };
        form.addEventListener('submit', syncMarkdownToTextarea, true);
        form.addEventListener('submit', syncMarkdownToTextarea, false);
    })();
</script>
</body>
</html>
