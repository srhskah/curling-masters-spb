<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('消息通知删除记录')}"></head>
<body th:classappend="${ipBgClass}">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: error-alert}"></div>
<div th:replace="~{fragments :: success-alert}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0">消息通知删除记录</h3>
        <a class="btn btn-outline-secondary btn-sm btn-mobile-compact" th:href="@{/notification/list}">
            <span class="btn-label">返回通知列表</span>
        </a>
    </div>

    <div class="admin-action-legend text-muted mb-2 d-none d-md-flex">
        <span class="legend-item fw-semibold">操作图例</span>
        <span class="legend-item"><i class="bi bi-eye"></i> 详情</span>
    </div>

    <div th:if="${items != null and !#lists.isEmpty(items)}">
        <!-- 窄屏：卡片 -->
        <div class="d-md-none mb-3">
            <div class="generic-cards-mobile">
                <div class="row g-3 generic-cards-grid">
                    <div class="col-12" th:each="d : ${items}">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="fw-semibold mb-2" th:text="${d.title}">标题</div>
                                <div class="generic-card-row" style="display:flex;flex-direction:column;gap:0.15rem;">
                                    <div class="d-flex justify-content-between">
                                        <div class="generic-card-label">类型</div>
                                        <div th:text="${(d.sourceType != null and !#strings.isEmpty(d.sourceType)) ? '自动' : '手动'}">手动</div>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <div class="generic-card-label">原发起者</div>
                                        <div th:text="${d.authorUsername}">—</div>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <div class="generic-card-label">删除人</div>
                                        <div th:text="${d.deletedByUsername}">—</div>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <div class="generic-card-label">删除时间</div>
                                        <div class="text-nowrap"
                                             th:text="${d.deletedAt != null ? #temporals.format(d.deletedAt,'yyyy-MM-dd HH:mm') : '-'}">-</div>
                                    </div>
                                </div>
                                <div class="mt-3 generic-list-actions">
                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{/notification/deleted/{id}(id=${d.id})}"
                                       title="详情" aria-label="详情">
                                        <i class="bi bi-eye"></i><span class="generic-action-label"> 详情</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 宽屏：表格 -->
        <div class="d-none d-md-block generic-table-desktop">
            <div class="table-responsive">
                <table class="table table-sm table-hover align-middle admin-mgmt-table">
                    <thead class="table-light">
                    <tr>
                        <th>原标题</th>
                        <th>类型</th>
                        <th>原发起者</th>
                        <th>删除人</th>
                        <th>删除时间</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${items}">
                        <td th:text="${d.title}">标题</td>
                        <td th:text="${(d.sourceType != null and !#strings.isEmpty(d.sourceType)) ? '自动' : '手动'}">手动</td>
                        <td th:text="${d.authorUsername}">—</td>
                        <td th:text="${d.deletedByUsername}">—</td>
                        <td class="text-nowrap"
                            th:text="${d.deletedAt != null ? #temporals.format(d.deletedAt,'yyyy-MM-dd HH:mm') : '-'}">-</td>
                        <td>
                            <div class="btn-group generic-list-actions" role="group">
                                <a class="btn btn-sm btn-outline-primary"
                                   th:href="@{/notification/deleted/{id}(id=${d.id})}"
                                   title="详情" aria-label="详情">
                                    <i class="bi bi-eye"></i><span class="generic-action-label"> 详情</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="text-muted" th:if="${items == null or #lists.isEmpty(items)}">暂无删除记录。</div>
</div>
<div th:replace="~{fragments :: footer}"></div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
