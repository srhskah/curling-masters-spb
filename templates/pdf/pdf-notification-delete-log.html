<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">删除记录</title>
    <style>
        body { font-family: "WenQuanYi Micro Hei", "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif; font-size: 14px; color: #222; }
        h2 { margin: 0; font-size: 18px; }
        .muted { color: #666; font-size: 12px; }
        .meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 0 0 16px; }
        .logo { width: 28.6%; max-width: 220px; min-width: 120px; height: auto; }
        .markdown-body { line-height: 1.55; margin-top: 8px; }
        .markdown-body table { border-collapse: collapse; width: 100%; margin: 0.75em 0; font-size: 13px; }
        .markdown-body th, .markdown-body td { border: 1px solid #ccc; padding: 0.35rem 0.5rem; }
        .sig-img { max-height: 64px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="meta">
    <img th:if="${logoDataUri != null}" class="logo" th:src="${logoDataUri}" alt="logo"/>
    <div style="flex: 1 1 auto;">
        <h2 th:text="${deleteLog != null ? deleteLog.title : '删除记录'}">删除记录</h2>
        <div class="muted" th:if="${deleteLog != null}"
             th:text="${'原通知ID：' + (deleteLog.messageId != null ? deleteLog.messageId : '—')}">原ID</div>
        <div class="muted" th:if="${deleteLog != null}"
             th:text="${'类型：' + ((deleteLog.sourceType != null and !#strings.isEmpty(deleteLog.sourceType)) ? '自动' : '手动')}">类型</div>
        <div class="muted" th:if="${deleteLog != null and deleteLog.authorUsername != null}"
             th:text="${'原发起者：' + deleteLog.authorUsername}">发起者</div>
        <div class="muted" th:if="${deleteLog != null and deleteLog.deletedByUsername != null}"
             th:text="${'删除人：' + deleteLog.deletedByUsername}">删除人</div>
        <div class="muted" th:if="${deleteLog != null and deleteLog.deletedAt != null}"
             th:text="${'删除时间：' + #temporals.format(deleteLog.deletedAt,'yyyy-MM-dd HH:mm:ss')}">删除时间</div>
        <div class="muted" th:if="${exportedAt != null}" th:text="${'导出时间：' + exportedAt}">导出时间</div>
    </div>
</div>
<div class="markdown-body" th:utext="${deleteLog != null ? deleteLog.contentHtml : ''}"></div>
<div style="margin-top:12px;">
    <div class="muted">删除时电子签名</div>
    <img class="sig-img"
         th:if="${deleteLog != null and deleteLog.signature != null and #strings.startsWith(deleteLog.signature, 'data:image/')}"
         th:src="${deleteLog.signature}" alt="签名"/>
    <div class="muted"
         th:if="${deleteLog == null or deleteLog.signature == null or #strings.isEmpty(deleteLog.signature)}">无签名</div>
</div>
</body>
</html>
