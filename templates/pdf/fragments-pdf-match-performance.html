<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 与 pdf-user-match-performance 单场块一致；可选 h2hPathLine 供 H2H 多场次导出 -->
<div th:fragment="matchBlock(m)" class="match-block"
     th:with="p1=${m.player1Name != null ? m.player1Name : '-'},
              p2=${m.player2Name != null ? m.player2Name : '-'},
              t1=${m.player1Total != null ? m.player1Total : 0},
              t2=${m.player2Total != null ? m.player2Total : 0},
              p1Wins=${m.player1Total != null and m.player2Total != null and m.player1Total > m.player2Total},
              p2Wins=${m.player1Total != null and m.player2Total != null and m.player2Total > m.player1Total},
              firstHammer=${m.sets != null and !#lists.isEmpty(m.sets) ? m.sets[0].hammer : null}">
    <div class="h2h-path muted small mb-1" th:if="${m['h2hPathLine'] != null}" th:text="${m['h2hPathLine']}">H2H 位置</div>
    <div class="match-title"
         th:text="${(m.category != null ? m.category : '-') + '（' + (m.phaseCode != null ? m.phaseCode : '-') + '） ' + (m.player1Name != null ? m.player1Name : '-') + ' vs ' + (m.player2Name != null ? m.player2Name : '-') + ' 总比分：' + (m.totalText != null ? m.totalText : '-')}">
        场次信息
    </div>
    <table class="score-matrix">
        <thead>
        <tr>
            <th>选手</th>
            <th th:each="s : ${m.sets}" th:text="${s.setNumber}">1</th>
            <th>总得分</th>
        </tr>
        </thead>
        <tbody>
        <tr th:classappend="${p1Wins} ? ' winner-row' : ''">
            <td th:classappend="${p1Wins} ? ' winner-name' : ''">
                <span th:text="${p1}">选手1</span>
                <th:block th:if="${firstHammer != null and firstHammer == p1}">
                    <span> </span><th:block th:replace="~{pdf/fragments-pdf-icons :: hammerMark}"></th:block>
                </th:block>
            </td>
            <td th:each="s : ${m.sets}" th:text="${s.player1ScoreText != null ? s.player1ScoreText : '0'}">0</td>
            <td th:classappend="${p1Wins} ? ' winner-total' : ''" th:text="${t1}">0</td>
        </tr>
        <tr th:classappend="${p2Wins} ? ' winner-row' : ''">
            <td th:classappend="${p2Wins} ? ' winner-name' : ''">
                <span th:text="${p2}">选手2</span>
                <th:block th:if="${firstHammer != null and firstHammer == p2}">
                    <span> </span><th:block th:replace="~{pdf/fragments-pdf-icons :: hammerMark}"></th:block>
                </th:block>
            </td>
            <td th:each="s : ${m.sets}" th:text="${s.player2ScoreText != null ? s.player2ScoreText : '0'}">0</td>
            <td th:classappend="${p2Wins} ? ' winner-total' : ''" th:text="${t2}">0</td>
        </tr>
        <tr th:if="${m.sets == null or #lists.isEmpty(m.sets)}"><td colspan="3" class="muted">暂无局分明细</td></tr>
        </tbody>
    </table>
    <table>
        <thead>
        <tr>
            <th style="width:24%;">验收人</th>
            <th style="width:44%;">验收时间</th>
            <th class="sig-cell">电子签名</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${m.acceptances == null or #lists.isEmpty(m.acceptances)}">
            <td colspan="3" class="muted">无</td>
        </tr>
        <tr th:each="a : ${m.acceptances}">
            <td th:text="${a.username != null ? a.username : '未知'}">验收人</td>
            <td th:text="${a.acceptedAt != null ? a.acceptedAt : '-'}">验收时间</td>
            <td class="sig-cell">
                <img th:if="${a.signature != null and #strings.startsWith(a.signature, 'data:image/')}"
                     th:src="${a.signature}"
                     alt="电子签名"
                     class="sig-img"/>
                <span th:if="${a.signature == null or a.signature == ''}" class="muted">无</span>
                <span th:if="${a.signature != null and a.signature != '' and !#strings.startsWith(a.signature, 'data:image/')}"
                      class="muted">已签名</span>
            </td>
        </tr>
        </tbody>
    </table>
    <div th:if="${m.editLogs != null and !#lists.isEmpty(m.editLogs)}" class="edit-logs-block">
        <div class="edit-logs-title">比分修改记录</div>
        <table class="edit-logs">
            <thead>
            <tr>
                <th style="width:12%;">局次</th>
                <th style="width:18%;">修改人</th>
                <th style="width:18%;">原比分</th>
                <th style="width:18%;">新比分</th>
                <th>修改时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${m.editLogs}">
                <td th:text="${log.setNumber != null ? log.setNumber : '-'}">1</td>
                <td th:text="${log.editorUsername != null ? log.editorUsername : '未知'}">修改人</td>
                <td th:text="${log.oldScore != null ? log.oldScore : '-'}">0:0</td>
                <td th:text="${log.newScore != null ? log.newScore : '-'}">0:0</td>
                <td th:text="${log.editedAt != null ? log.editedAt : '-'}">-</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
