<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 赛事详情页与 H2H 共用：原生 Bootstrap 场次详情/录分弹窗 + 电子签名弹窗 -->
<th:block th:fragment="groupMatchScoreModalAndSignature">
    <div id="groupMatchScoreModalMeta" class="d-none"
         th:attr="data-current-user-id=${currentUser != null && currentUser.id != null ? #strings.toString(currentUser.id) : ''},
                  data-current-username=${currentUser != null && currentUser.username != null ? currentUser.username : ''}"></div>

    <div class="modal fade" id="groupMatchScoreModal" tabindex="-1" aria-labelledby="groupMatchScoreModalTitle" style="z-index:1919810;">
        <div class="modal-dialog modal-xl modal-fullscreen-sm-down modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="groupMatchScoreModalTitle">单场比赛录分</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="groupMatchIdInput">
                    <div id="groupMatchReadOnlyHint" class="alert alert-info py-2 small d-none mb-2" role="status">
                        <i class="bi bi-eye" aria-hidden="true"></i> 当前为<strong>只读查看</strong>。仅<strong>办赛人员</strong>（管理员/主办）与<strong>本场比赛双方选手</strong>可修改比分、先后手、保存与验收。
                    </div>
                    <div class="mb-2 small text-muted" id="groupMatchTitle"></div>
                    <div class="mb-2 d-flex align-items-center gap-2 flex-wrap group-match-action-bar">
                        <button type="button" class="btn btn-sm group-sig-btn group-sig-btn--unsigned" id="groupSignatureOpenBtn"
                                onclick="openSignatureModal()"
                                title="请签名验收"
                                aria-label="请签名验收"
                                aria-pressed="false">请签名验收</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="groupMatchCopyBtn">复制本场战绩文本</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="groupMatchExportPdfBtn">导出本场战绩PDF</button>
                    </div>
                    <div class="group-match-meta-bar mb-2">
                        <label class="group-match-meta-label" for="groupFirstEndHammer">开局后手</label>
                        <select class="form-select group-match-meta-hammer" id="groupFirstEndHammer">
                            <option value="">不设置</option>
                            <option value="1" id="groupHammerPlayer1Option">player1</option>
                            <option value="2" id="groupHammerPlayer2Option">player2</option>
                        </select>
                        <label class="group-match-meta-label" for="groupSetCount">局数</label>
                        <input type="number" min="1" max="20" id="groupSetCount" class="form-control group-match-meta-sets" value="8" inputmode="numeric">
                        <button type="button" class="btn btn-outline-primary group-match-meta-action" id="groupRenderScoreRowsBtn" onclick="renderGroupScoreRows()">生成/重置局数</button>
                    </div>
                    <div class="table-responsive score-entry-wrap match-score-mobile-optimized">
                        <table class="table table-sm table-bordered align-middle score-entry-table">
                            <caption class="visually-hidden">各局比分录入</caption>
                            <thead class="table-light">
                            <tr>
                                <th class="score-name-col-head" scope="col">选手名称</th>
                                <th class="score-total-col-head" scope="col">总比分</th>
                                <th class="score-ends-head-cell" scope="col">
                                    <div class="score-ends-grid" data-score-ends-header></div>
                                </th>
                            </tr>
                            </thead>
                            <tbody id="groupScoreRows"></tbody>
                        </table>
                    </div>
                    <div class="mt-2">
                        <div class="small fw-bold" id="groupAcceptanceHeading">验收信息</div>
                        <div class="small text-muted mb-2" id="groupAcceptanceStatusLine" role="status">暂无</div>
                        <div class="table-responsive match-score-h-scroll" id="groupAcceptanceScroll">
                            <table class="table table-sm table-bordered align-middle mb-0 match-score-h-scroll-table" id="groupAcceptanceTable" aria-labelledby="groupAcceptanceHeading">
                                <thead class="table-light">
                                <tr>
                                    <th scope="col">验收人</th>
                                    <th scope="col">电子签名</th>
                                    <th scope="col">验收时间</th>
                                </tr>
                                </thead>
                                <tbody id="groupAcceptanceTbody">
                                <tr><td colspan="3" class="text-muted text-center">暂无</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="mt-2">
                        <div class="small fw-bold" id="groupEditLogHeading">比分修改记录</div>
                        <div class="table-responsive match-score-h-scroll" id="groupEditLogScroll">
                            <table class="table table-sm table-striped table-hover table-bordered align-middle mb-0 match-score-h-scroll-table" id="groupEditLogTable" aria-labelledby="groupEditLogHeading">
                                <thead class="table-light">
                                <tr>
                                    <th scope="col">局次</th>
                                    <th scope="col">修改人</th>
                                    <th scope="col">修改前</th>
                                    <th scope="col">修改后</th>
                                    <th scope="col">修改时间</th>
                                </tr>
                                </thead>
                                <tbody id="groupEditLogTbody">
                                <tr><td colspan="5" class="text-muted text-center">暂无</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="groupSaveScoreBtn" onclick="saveGroupMatchScore()">保存比分</button>
                    <button type="button" class="btn btn-success" id="groupAcceptScoreBtn" onclick="acceptGroupMatchScore()">验收并锁定</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="signatureModal" tabindex="-1" aria-labelledby="signatureModalTitle" style="z-index:1919815;"
         th:attr="data-signer-username=${currentUser != null && currentUser.username != null ? currentUser.username : ''},
                  data-signer-user-id=${currentUser != null && currentUser.id != null ? #strings.toString(currentUser.id) : ''}">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="signatureModalTitle">手写电子签名</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <canvas id="signatureCanvas" width="420" height="180"
                            role="img" tabindex="0"
                            aria-label="手写签名区域，可用鼠标或触控绘制；亦可用下方文字签名作为非拖拽替代"
                            style="width:100%;border:1px solid #ced4da;border-radius:6px;background:#fff;touch-action:none;"></canvas>
                    <div class="small text-muted mt-2" id="signatureCanvasHint">请在签名框内手写，或输入文字后点击「使用文字签名」绘入画板；空白无法提交。验收图将带淡色倾斜水印。</div>
                    <div class="mt-3">
                        <label class="form-label" for="signatureTextFallback">文字签名（非拖拽替代）</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="signatureTextFallback"
                                   maxlength="80" autocomplete="name"
                                   placeholder="输入姓名作为签名"
                                   aria-describedby="signatureCanvasHint">
                            <button type="button" class="btn btn-outline-primary" id="signatureTextApplyBtn"
                                    onclick="applyTextSignatureFallback()">使用文字签名</button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" onclick="clearSignatureCanvas()">清除</button>
                    <button type="button" class="btn btn-primary" onclick="saveSignatureCanvas()">使用该签名</button>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
