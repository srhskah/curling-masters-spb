<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('系统配置管理')}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body th:classappend="${ipBgClass}">
    <div th:replace="~{fragments :: navbar}"></div>

    <!-- 消息提示 -->
    <div th:replace="~{fragments :: success-alert}"></div>
    <div th:replace="~{fragments :: error-alert}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-gear"></i> 系统配置管理
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/system-config/save}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            
                            <div class="mb-4">
                                <h6 class="fw-bold mb-3">赛制规则默认值设置</h6>
                                <p class="text-muted small mb-3">
                                    设置后，所有有权限设置赛事详情的用户，在赛事详情中选择"自定义"赛制规则时，
                                    如果未单独设置x和y，都将采用超级管理员设定的默认值。
                                </p>
                                
                                <div class="mb-3">
                                    <label for="defaultCenterLineLimit" class="form-label">
                                        默认不允许磕中线壶的数量（0-16）
                                    </label>
                                    <input type="number" 
                                           class="form-control" 
                                           id="defaultCenterLineLimit" 
                                           name="defaultCenterLineLimit"
                                           th:value="${defaultCenterLineLimit}"
                                           min="0" 
                                           max="16" 
                                           required>
                                    <div class="form-text">设置自定义赛制规则时的默认值，范围：0-16</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="defaultDeadStoneLimit" class="form-label">
                                        默认不允许打成死壶的数量（0-16）
                                    </label>
                                    <input type="number" 
                                           class="form-control" 
                                           id="defaultDeadStoneLimit" 
                                           name="defaultDeadStoneLimit"
                                           th:value="${defaultDeadStoneLimit}"
                                           min="0" 
                                           max="16" 
                                           required>
                                    <div class="form-text">设置自定义赛制规则时的默认值，范围：0-16</div>
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> 保存设置
                                </button>
                                <a th:href="@{/}" class="btn btn-secondary">
                                    <i class="bi bi-house"></i> 返回首页
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
