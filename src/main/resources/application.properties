spring.application.name=demo
server.address=0.0.0.0
server.port=8080
# Docker / 反向代理后让重定向与绝对链接使用对外 Host（避免 fetch/浏览器跳到 localhost）
server.forward-headers-strategy=framework
# 对外可访问的站点根地址（RSS 绝对链接用）。例：https://curling.example.com  留空则用当前请求 Host
# 本地用 127.0.0.1 打开时若不配置，源内链接会是 localhost，外网 RSS 平台无法使用
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# Tomcat 线程（2 核小机：避免默认过大线程池占内存/上下文切换）
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:40}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE:2}
server.tomcat.accept-count=50

# 静态资源缓存：本地默认关；生产用 SPRING_PROFILES_ACTIVE=prod 或 STATIC_CACHE_MAX_AGE=86400
spring.web.resources.cache.cachecontrol.max-age=${STATIC_CACHE_MAX_AGE:0}
spring.web.resources.cache.cachecontrol.no-cache=${STATIC_NO_CACHE:true}
spring.web.resources.cache.cachecontrol.no-store=${STATIC_NO_STORE:true}
spring.web.resources.chain.cache=${STATIC_CHAIN_CACHE:false}
# WebConfig ResourceHandler 缓存秒数（0=不缓存）
app.static-cache-seconds=${APP_STATIC_CACHE_SECONDS:0}

# 数据源配置
spring.datasource.url=${MYSQL_DB_URL:jdbc:mysql://localhost:3306/curling_masters?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池：2c4g 默认缩小；可用环境变量覆盖
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis Plus：默认不把每条 SQL 打到 stdout（生产 CPU/磁盘杀手）；调试可设 MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# 字符集配置
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Jackson JSON 配置（支持Unicode）
spring.jackson.charset=UTF-8
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false

# 时区配置
spring.jackson.time-zone=Asia/Shanghai
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# 默认 true：清除 flyway_schema_history 中失败记录并校正 checksum；本地若需严格校验可设 FLYWAY_REPAIR_ON_MIGRATE=false
spring.flyway.repair-on-migrate=${FLYWAY_REPAIR_ON_MIGRATE:true}

# 日志：默认 INFO（DEBUG 在请求+定时任务下极易打满 2 核）；可用 LOGGING_LEVEL_COM_EXAMPLE=DEBUG 临时打开
logging.file.path=./app/logs
logging.file.name=./app/logs/curling-masters.log
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example=${LOGGING_LEVEL_COM_EXAMPLE:INFO}
logging.level.com.zaxxer.hikari=${LOGGING_LEVEL_HIKARI:WARN}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Thymeleaf：本地默认关缓存便于改模板；生产设 SPRING_THYMELEAF_CACHE=true
spring.thymeleaf.prefix=file:/app/templates/
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
# 静态资源（CSS/JS/图片）也从外部目录加载
spring.web.resources.static-locations=file:/app/static/

