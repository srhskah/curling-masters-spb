# CI：单元测试为必过门禁；集成测试单独跑、不阻断合入（本地用 ./gradlew integrationTest）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

  # 抽签全流程等 @Tag("integration")；需 MySQL。暂不作为合入门禁，避免长期红灯。
  # 修复后可将 continue-on-error 去掉，或改回与 unit 同 job。
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ci_integration_root
          MYSQL_DATABASE: draw_it_integration
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run integration tests
        env:
          DRAW_IT_JDBC_URL: "jdbc:mysql://127.0.0.1:3306/draw_it_integration?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true"
          DRAW_IT_DB_USER: root
          DRAW_IT_DB_PASSWORD: ci_integration_root
        run: ./gradlew integrationTest --no-daemon --stacktrace