name: Build and Push to ACR

on:
  push:
    branches: [ "main" ] # 只有推送到 main 分支时才触发

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Sync Code (Pure SSOT with Auto-Init)
        run: |
          DEPLOY_DIR="$HOME/.runner-build-cache"
          echo "DEPLOY_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"
          
          # 1. 如果目录不存在，提示手动克隆（绝对不卡）
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "❌ 错误：部署目录不存在！"
            echo "请在本地终端手动执行一次：git clone https://github.com/srhskah/curling-masters-spb.git ~/.runner-build-cache"
            exit 1
          fi
          
          cd "$DEPLOY_DIR"
          
          # 2. 强制 Git 走 IPv4，防止因为 IPv6 黑洞导致卡死
          git config --local http.version HTTP/1.1
          
          # 3. 拉取远端最新（兼容 force-push / 历史重写后的非快进）
          git fetch --prune origin main
          
          # 4. 强制硬重置（完美 SSOT）
          git reset --hard origin/main
          
          # 5. 清理所有未跟踪的垃圾文件
          git clean -fdx

      # - name: Checkout Code
      #   uses: actions/checkout@v4

      - name: Set up JDK 21 (Local)
        run: |
          JAVA_PATH=$(readlink -f $(which java))
          export JAVA_HOME=$(dirname $(dirname $JAVA_PATH))
          
          echo "Detected JAVA_HOME: $JAVA_HOME"
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: |
          cd "$DEPLOY_DIR"
          ./gradlew build -x test
        
      - name: Remove credsStore from Docker config
        run: |
          if [ -f ~/.docker/config.json ]; then
            # 使用 jq 删除 credsStore 和 credStore（如果存在）
            if command -v jq &> /dev/null; then
              jq 'del(.credsStore, .credStore)' ~/.docker/config.json > ~/.docker/config.json.tmp && mv ~/.docker/config.json.tmp ~/.docker/config.json
            else
              # 或者使用 Python
              python3 -c "import json; f='$HOME/.docker/config.json'; d=json.load(open(f)); d.pop('credsStore', None); d.pop('credStore', None); json.dump(d, open(f, 'w'))"
            fi
          fi

      - name: Log in to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login --username ${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
        # uses: docker/login-action@v3
        # with:
        #   registry: ${{ secrets.ACR_REGISTRY }}
        #   username: ${{ secrets.ACR_USERNAME }}
        #   password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          cd "$DEPLOY_DIR"
          export DOCKER_BUILDKIT=0
          IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/jw_docker_sql/curling-masters:latest"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
        # uses: docker/build-push-action/v5
        # with:
        #   context: .
        #   push: true
        #   tags: ${{ secrets.ACR_REGISTRY }}/jw_docker_sql/curling-masters:latest
