name: Build and Push to ACR

on:
  push:
    branches: [ "main" ] # 只有推送到 main 分支时才触发

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Set up JDK 21
      #   uses: actions/setup-java@v5 # 顺手升级到v5
      #   with:
      #     java-version: '21'
      #     distribution: 'temurin'
      #     cache: gradle
      - name: Set up JDK 21 (Local)
        run: |
          echo "JAVA_HOME=/home/jw/.sdkman/candidates/java/21.0.13.0+9-tem" >> $GITHUB_ENV
          echo "/home/jw/.sdkman/candidates/java/21.0.13.0+9-tem/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Log in to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login --username ${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
        # uses: docker/login-action@v3
        # with:
        #   registry: ${{ secrets.ACR_REGISTRY }}
        #   username: ${{ secrets.ACR_USERNAME }}
        #   password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          export DOCKER_BUILDKIT=0
          IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/jw_docker_sql/curling-masters:latest"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
        # uses: docker/build-push-action@v5
        # with:
        #   context: .
        #   push: true
        #   tags: ${{ secrets.ACR_REGISTRY }}/jw_docker_sql/curling-masters:latest