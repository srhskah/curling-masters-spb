name: Build and Push to ACR

on:
  push:
    branches: [ "main" ] # 只有推送到 main 分支时才触发

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      # - name: Checkout Code
      #   uses: actions/checkout@v4
      - name: Pull latest code
        run: |
          # 这里的路径改成你本地真正存放源码的目录
          cd ~/webapp/curling-masters
          git pull origin main
      - name: Set up JDK 21 (Local)
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build with Gradle
        run: ./gradlew build -x test # 跳过测试加快速度

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/jw_docker_sql/curling-masters:latest